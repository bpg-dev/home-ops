---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  values:
    # Feeds cephClusterSpec.cephVersion.image and the toolbox image. Rook only uses
    # it for the Ceph CLI clients here (toolbox, cmd-reporter); keep it on the same
    # release as the external PVE cluster (Ceph 20.2.4 Tentacle, see
    # docs/CEPH_SQUID_TO_TENTACLE_UPGRADE.md and docs/PVE_HOST_LAYOUT.md). Renovate
    # holds it below the next major (.renovaterc.json5).
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4
    operatorNamespace: rook-ceph-external
    # Cluster name should match the namespace for external clusters
    clusterName: rook-ceph-external
    monitoring:
      enabled: true
      createPrometheusRules: true
      metricsDisabled: false
    toolbox:
      enabled: true
    cephClusterSpec:
      # The monitoring section should be removed from the cephClusterSpec
      external:
        enable: true
        # Reference the secret containing Ceph cluster credentials
        # The ConfigMap rook-ceph-mon-endpoints is automatically discovered
        secretName: rook-ceph-mon
      crashCollector:
        disable: true
      csi:
        cephfs:
          # rook v1.20 no longer reads CSI_CEPHFS_KERNEL_MOUNT_OPTIONS from the
          # operator chart; the CephCluster spec is the only place left that feeds
          # the ClientProfile's kernelMountOptions (msgr2 CRC mode for the kernel client).
          kernelMountOptions: ms_mode=prefer-crc
      healthCheck:
        daemonHealth:
          mon:
            disabled: false
            interval: 45s
    cephBlockPools: {}
    cephFileSystems: {}
    cephObjectStores: {}
