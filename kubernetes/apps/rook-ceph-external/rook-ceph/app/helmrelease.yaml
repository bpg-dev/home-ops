---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  # The CSI image-set ConfigMap (rook-csi-operator-image-set-configmap) was created
  # by the rook v1.19 operator, which still owns its .data fields via server-side
  # apply. The v1.20 Helm upgrade therefore left the old image tags in place even
  # though the chart now renders the ConfigMap. Drift detection lets Flux patch the
  # chart's values back; a server-side diff of the whole release showed those four
  # fields as the only drift (2026-10-05, docs/ROOK_CEPH_V1_20_UPGRADE.md).
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    csi:
      # Everything else that used to live here (driver enables, replicas, affinity,
      # kernel mount options, krbd, liveness) is configured by the ceph-csi-drivers
      # chart since rook v1.20 (see ../csi-drivers and docs/ROOK_CEPH_V1_20_UPGRADE.md).
      # The chart has no values schema, so stale keys would be ignored silently.
      serviceMonitor:
        enabled: true
    enableDiscoveryDaemon: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangeable
        cpu: 100m # unchangeable
      limits: {}
